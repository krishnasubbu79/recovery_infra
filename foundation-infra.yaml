AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Foundation Recovery Infrastructure (v1).
  Provisions isolated VPC, 2 derived /24 subnets, Route Tables,
  VPC Flow Logs, Baseline Validation Security Group, and App Stack IAM boundary.
  (S3 Package Bucket and VPC Endpoints parked for v2).

Parameters:
  EnvironmentName:
    Type: String
    Default: recovery-foundation
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Prefix used for all CloudFormation Exports in this Region.

  VpcCidr:
    Type: String
    Default: '10.240.0.0/20'
    AllowedPattern: '^10\.240\.(0|16|32|48|64|80|96|112|128|144|160|176|192|208|224|240)\.0/20$'
    ConstraintDescription: Must be an aligned /20 inside 10.240.0.0/16 (for example 10.240.16.0/20).
    Description: Approved /20 CIDR block for the recovery VPC (inside 10.240.0.0/16).

  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: First Availability Zone.

  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second Availability Zone.

Resources:
  # =========================================================================
  # 1. NETWORKING (Isolated VPC, Derived /24 Subnets, Route Tables)
  # =========================================================================
  RecoveryVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecoveryVpc
      CidrBlock: !Select [0, !Cidr [!GetAtt RecoveryVpc.CidrBlock, 2, 8]]
      AvailabilityZone: !Ref AvailabilityZoneA
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecoveryVpc
      CidrBlock: !Select [1, !Cidr [!GetAtt RecoveryVpc.CidrBlock, 2, 8]]
      AvailabilityZone: !Ref AvailabilityZoneB
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-b'

  RouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RecoveryVpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rt-a'

  RouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RecoveryVpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rt-b'

  SubnetRouteTableAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref RouteTableA

  SubnetRouteTableAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref RouteTableB

  # =========================================================================
  # 2. BASELINE SECURITY GROUP
  # =========================================================================
  ValidationClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${EnvironmentName}-validation-client-sg'
      GroupDescription: Baseline SG for validation hosts. Egress scoped to VPC CIDR.
      VpcId: !Ref RecoveryVpc
      SecurityGroupEgress:
        - Description: Allow outbound validation checks to restored workloads inside VPC
          IpProtocol: tcp
          FromPort: 1
          ToPort: 65535
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-validation-client-sg'

  # =========================================================================
  # 3. VPC FLOW LOGS
  # =========================================================================
  # Retained as audit evidence after the stack is deleted. The name ends with
  # this stack's ID so a redeploy with the same EnvironmentName never collides
  # with a group retained from an earlier stack.
  VpcFlowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - '/aws/vpc/${EnvironmentName}-flow-logs-${StackUuid}'
        - StackUuid: !Select [2, !Split ['/', !Ref 'AWS::StackId']]
      RetentionInDays: 90

  VpcFlowLogDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: FlowLogDelivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogGroups'
                  - 'logs:DescribeLogStreams'
                Resource: !GetAtt VpcFlowLogGroup.Arn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref RecoveryVpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref VpcFlowLogGroup
      DeliverLogsPermissionArn: !GetAtt VpcFlowLogDeliveryRole.Arn

  # =========================================================================
  # 4. FAILURE LOG (in-account only: EventBridge default bus -> CloudWatch Logs)
  # =========================================================================
  # Records every CloudFormation stack/resource failure or rollback in this
  # Region (including all application stacks) and every failed or aborted
  # AWS Backup backup, copy, or restore job. Retained like the flow logs.
  FailureLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - '/aws/events/${EnvironmentName}-failures-${StackUuid}'
        - StackUuid: !Select [2, !Split ['/', !Ref 'AWS::StackId']]
      RetentionInDays: 365

  FailureLogResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-failure-log-events'
      PolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "EventBridgeToFailureLog",
                "Effect": "Allow",
                "Principal": { "Service": ["events.amazonaws.com", "delivery.logs.amazonaws.com"] },
                "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
                "Resource": "${LogGroupArn}",
                "Condition": {
                  "ArnEquals": { "aws:SourceArn": "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EnvironmentName}-failures" }
                }
              }
            ]
          }
        - LogGroupArn: !GetAtt FailureLogGroup.Arn

  FailureEventRule:
    Type: AWS::Events::Rule
    DependsOn: FailureLogResourcePolicy
    Properties:
      Name: !Sub '${EnvironmentName}-failures'
      Description: Log CloudFormation failures/rollbacks and failed AWS Backup jobs to CloudWatch Logs.
      State: ENABLED
      EventPattern:
        $or:
          - source: ['aws.cloudformation']
            detail-type:
              - 'CloudFormation Stack Status Change'
              - 'CloudFormation Resource Status Change'
            detail:
              status-details:
                status:
                  - suffix: '_FAILED'
                  - wildcard: '*ROLLBACK*'
          - source: ['aws.backup']
            detail-type:
              - 'Backup Job State Change'
              - 'Copy Job State Change'
              - 'Restore Job State Change'
            detail:
              $or:
                - state: ['FAILED', 'ABORTED', 'EXPIRED']
                - status: ['FAILED', 'ABORTED', 'EXPIRED']
      Targets:
        - Id: FailureLog
          Arn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${FailureLogGroup}'

  # =========================================================================
  # 5. PERMISSIONS BOUNDARY FOR APP STACK ROLES
  # =========================================================================
  AppRolePermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${EnvironmentName}-${AWS::Region}-app-boundary'
      Description: Mandatory permissions boundary for all IAM roles created by Application Stacks.
      # A boundary is a ceiling: the effective permission is the intersection
      # with the role's own policies. It must therefore cover everything the
      # AWS Backup service role does during backup, copy, and restore of RDS,
      # Aurora, EFS, EC2/EBS, and S3 (the AWS managed service-role policies).
      # Anything not allowed here, including all IAM actions except PassRole
      # to EC2, is implicitly denied.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBackupAndWorkloadServices
            Effect: Allow
            Action:
              - 'backup:*'
              - 'backup-storage:*'
              - 'rds:*'
              - 'elasticfilesystem:*'
              - 'ec2:*'
              - 'ebs:StartSnapshot'
              - 'ebs:PutSnapshotBlock'
              - 'ebs:CompleteSnapshot'
              - 'tag:GetResources'
              - 'cloudwatch:GetMetricData'
              - 'events:ListRules'
            Resource: '*'
          - Sid: AllowKmsDataOperations
            Effect: Allow
            Action:
              - 'kms:DescribeKey'
              - 'kms:Decrypt'
              - 'kms:Encrypt'
              - 'kms:GenerateDataKey*'
              - 'kms:ReEncrypt*'
              - 'kms:CreateGrant'
              - 'kms:RetireGrant'
              - 'kms:ListGrants'
            Resource: '*'
          - Sid: AllowS3OnRecoveryBucketsOnly
            Effect: Allow
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::rec-*'
              - !Sub 'arn:${AWS::Partition}:s3:::rec-*/*'
          - Sid: AllowS3ListAllBuckets
            Effect: Allow
            Action: 's3:ListAllMyBuckets'
            Resource: '*'
          - Sid: AllowS3BackupEventRules
            Effect: Allow
            Action: 'events:*'
            Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/AwsBackupManagedRule*'
          - Sid: AllowPassRoleToEc2ForInstanceRestores
            Effect: Allow
            Action: 'iam:PassRole'
            Resource: '*'
            Condition:
              StringEquals:
                'iam:PassedToService': 'ec2.amazonaws.com'
          - Sid: DenyNetworkEscapeAndFoundationChanges
            Effect: Deny
            Action:
              - 'ec2:CreateVpc'
              - 'ec2:DeleteVpc'
              - 'ec2:ModifyVpcAttribute'
              - 'ec2:CreateSubnet'
              - 'ec2:DeleteSubnet'
              - 'ec2:ModifySubnetAttribute'
              - 'ec2:CreateRouteTable'
              - 'ec2:DeleteRouteTable'
              - 'ec2:CreateRoute'
              - 'ec2:ReplaceRoute'
              - 'ec2:AssociateRouteTable'
              - 'ec2:ReplaceRouteTableAssociation'
              - 'ec2:CreateInternetGateway'
              - 'ec2:AttachInternetGateway'
              - 'ec2:CreateEgressOnlyInternetGateway'
              - 'ec2:CreateNatGateway'
              - 'ec2:AllocateAddress'
              - 'ec2:AssociateAddress'
              - 'ec2:CreateVpcPeeringConnection'
              - 'ec2:AcceptVpcPeeringConnection'
              - 'ec2:CreateTransitGatewayVpcAttachment'
              - 'ec2:CreateVpnGateway'
              - 'ec2:AttachVpnGateway'
              - 'ec2:CreateVpcEndpoint'
              - 'ec2:DeleteFlowLogs'
              - 'ec2:AuthorizeSecurityGroupIngress'
              - 'ec2:AuthorizeSecurityGroupEgress'
            Resource: '*'

Outputs:
  FlowLogGroupName:
    Description: CloudWatch Logs group for VPC Flow Logs (retained when the stack is deleted).
    Value: !Ref VpcFlowLogGroup
  FailureLogGroupName:
    Description: CloudWatch Logs group recording CloudFormation and AWS Backup failures (retained when the stack is deleted).
    Value: !Ref FailureLogGroup
  VpcId:
    Value: !Ref RecoveryVpc
    Export:
      Name: !Sub '${EnvironmentName}-VpcId'
  VpcCidr:
    Value: !GetAtt RecoveryVpc.CidrBlock
    Export:
      Name: !Sub '${EnvironmentName}-VpcCidr'
  SubnetIdA:
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub '${EnvironmentName}-SubnetIdA'
  SubnetIdB:
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub '${EnvironmentName}-SubnetIdB'
  ValidationClientSecurityGroupId:
    Value: !Ref ValidationClientSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-ValidationSgId'
  AppRolePermissionsBoundaryArn:
    Value: !Ref AppRolePermissionsBoundary
    Export:
      Name: !Sub '${EnvironmentName}-BoundaryArn'
