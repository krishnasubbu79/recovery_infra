              Name: !Sub '/recovery/${ApplicationId}/${RecoveryRequestId}/workload-sg-id'
              Type: String
              Value: !Ref WorkloadSecurityGroup
              Description: !Sub 'Workload Security Group ID for ${ApplicationId} (${RecoveryRequestId})'
