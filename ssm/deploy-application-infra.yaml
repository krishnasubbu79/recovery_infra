        TEMPLATE = r"""AWSTemplateFormatVersion: '2010-09-09'
        # Fn::ForEach (one Workload SG rule per port in WorkloadPorts) needs this transform.
        Transform: AWS::LanguageExtensions
        Description: >
          Per-Request Application Recovery Infrastructure (v1 - Multi-Service + Multi-Source LAG KMS + SSM).
          Creates a unified RequestKmsKey, 14-day LAG Vault, Compatibility Staging Vault,
          always-available RDS DB Subnet Group, Workload and EFS SGs, Multi-Service Restore IAM Role
          (authorized for multiple incoming Source KMS Keys), Operator Policy, and SSM Parameters.

        Parameters:
          FoundationEnvironmentName:
            Type: String
            Default: recovery-foundation
            AllowedPattern: '^[a-z0-9-]+$'
            Description: Must match the EnvironmentName of the regional Foundation stack.

          ApplicationId:
            Type: String
            AllowedPattern: '^[a-z0-9]{2,16}$'
            Description: Short application identifier (2-16 lowercase alphanumeric chars, e.g., payments).

          RecoveryRequestId:
            Type: String
            AllowedPattern: '^[a-z0-9-]{4,24}$'
            Description: Unique recovery request ID (4-24 lowercase alphanumeric/hyphen chars, e.g., req-01).

          NeedStagingVault:
            Type: String
            Default: 'true'
            AllowedValues: ['true', 'false']
            Description: Set to true so non-fully-managed backups (Aurora/RDS/EC2) land in Staging before copying to LAG.

          WorkloadPorts:
            Type: CommaDelimitedList
            Default: '5432'
            AllowedPattern: '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
            ConstraintDescription: Each port must be a number from 1 to 65535, separated by commas with no spaces (e.g., 5432,3306) and listed once.
            Description: TCP ports opened on the Workload SG (RDS/Aurora/EC2) from the Foundation Validation SG, comma-separated (e.g., 5432 or 5432,3306,22). EFS uses the separate EFS SG on 2049.

          SourceKmsKeyArns:
            Type: CommaDelimitedList
            AllowedPattern: '^\s*arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key\/[a-f0-9-]+\s*$'
            Description: Comma-separated list of Source/Bunker LAG Vault KMS Key ARNs encrypting incoming recovery points.

          ProdRecipientAccountId:
            Type: String
            Default: ''
            AllowedPattern: '^([0-9]{12})?$'
            Description: Optional 12-digit Production AWS Account ID. Leave empty during local testing.

        Conditions:
          CreateStagingVault: !Equals [!Ref NeedStagingVault, 'true']
          HasProdRecipientAccount: !Not [!Equals [!Ref ProdRecipientAccountId, '']]

        Resources:
          # =========================================================================
          # 1. UNIFIED RECOVERY KMS KEY
          # =========================================================================
          RequestKmsKey:
            Type: AWS::KMS::Key
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: !Sub 'Unified Recovery CMK for App ${ApplicationId} (${RecoveryRequestId})'
              EnableKeyRotation: true
              KeyPolicy:
                Version: '2012-10-17'
                Statement:
                  - Sid: EnableAccountRootAdmin
                    Effect: Allow
                    Principal:
                      AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
                    Action: 'kms:*'
                    Resource: '*'
                  - Sid: AllowAwsBackupServiceAccess
                    Effect: Allow
                    Principal:
                      Service: backup.amazonaws.com
                    Action:
                      - 'kms:Encrypt'
                      - 'kms:Decrypt'
                      - 'kms:ReEncrypt*'
                      - 'kms:GenerateDataKey*'
                      - 'kms:DescribeKey'
                      - 'kms:CreateGrant'
                    Resource: '*'
                    Condition:
                      StringEquals:
                        'aws:SourceAccount': !If
                          - HasProdRecipientAccount
                          - [!Ref 'AWS::AccountId', !Ref ProdRecipientAccountId]
                          - [!Ref 'AWS::AccountId']
                  - Sid: AllowLocalWorkloadServiceRestoresAndBackups
                    Effect: Allow
                    Principal:
                      AWS: '*'
                    Action:
                      - 'kms:Encrypt'
                      - 'kms:Decrypt'
                      - 'kms:ReEncrypt*'
                      - 'kms:GenerateDataKey*'
                      - 'kms:DescribeKey'
                      - 'kms:CreateGrant'
                    Resource: '*'
                    Condition:
                      StringEquals:
                        'kms:CallerAccount': !Ref 'AWS::AccountId'
                      StringLike:
                        'kms:ViaService':
                          - !Sub 'backup.${AWS::Region}.amazonaws.com'
                          - !Sub 'rds.${AWS::Region}.amazonaws.com'
                          - !Sub 'elasticfilesystem.${AWS::Region}.amazonaws.com'
                          - !Sub 'ec2.${AWS::Region}.amazonaws.com'
                          - !Sub 's3.${AWS::Region}.amazonaws.com'
                  # Prod restores from the RAM-shared LAG vault through its own AWS
                  # Backup restore role and the AWS Backup service-linked role, so the
                  # account principal is required, but only for calls made through
                  # AWS services in this Region.
                  - !If
                    - HasProdRecipientAccount
                    - Sid: AllowProdRecipientAccountDescribeKey
                      Effect: Allow
                      Principal:
                        AWS: !Sub 'arn:${AWS::Partition}:iam::${ProdRecipientAccountId}:root'
                      Action: 'kms:DescribeKey'
                      Resource: '*'
                    - !Ref 'AWS::NoValue'
                  - !If
                    - HasProdRecipientAccount
                    - Sid: AllowProdRecipientAccountDecryptViaService
                      Effect: Allow
                      Principal:
                        AWS: !Sub 'arn:${AWS::Partition}:iam::${ProdRecipientAccountId}:root'
                      Action:
                        - 'kms:Decrypt'
                        - 'kms:ReEncryptFrom'
                        - 'kms:GenerateDataKey*'
                      Resource: '*'
                      Condition:
                        StringLike:
                          'kms:ViaService':
                            - !Sub 'backup.${AWS::Region}.amazonaws.com'
                            - !Sub 'rds.${AWS::Region}.amazonaws.com'
                            - !Sub 'elasticfilesystem.${AWS::Region}.amazonaws.com'
                            - !Sub 'ec2.${AWS::Region}.amazonaws.com'
                            - !Sub 's3.${AWS::Region}.amazonaws.com'
                    - !Ref 'AWS::NoValue'
                  - !If
                    - HasProdRecipientAccount
                    - Sid: AllowProdRecipientAccountGrantCreation
                      Effect: Allow
                      Principal:
                        AWS: !Sub 'arn:${AWS::Partition}:iam::${ProdRecipientAccountId}:root'
                      Action: 'kms:CreateGrant'
                      Resource: '*'
                      Condition:
                        Bool:
                          'kms:GrantIsForAWSResource': 'true'
                    - !Ref 'AWS::NoValue'
              Tags:
                - Key: ApplicationId
                  Value: !Ref ApplicationId
                - Key: RecoveryRequestId
                  Value: !Ref RecoveryRequestId
                - Key: ProdRecipientAccountId
                  Value: !If [HasProdRecipientAccount, !Ref ProdRecipientAccountId, 'LOCAL_TEST_ONLY']

          RequestKmsAlias:
            Type: AWS::KMS::Alias
            Properties:
              AliasName: !Sub 'alias/rec-${ApplicationId}-${RecoveryRequestId}'
              TargetKeyId: !Ref RequestKmsKey

          # =========================================================================
          # 2. BACKUP VAULTS
          # =========================================================================
          HandoffLagVault:
            Type: AWS::Backup::LogicallyAirGappedBackupVault
            Properties:
              BackupVaultName: !Sub 'rec-lag-${ApplicationId}-${RecoveryRequestId}'
              EncryptionKeyArn: !GetAtt RequestKmsKey.Arn
              MinRetentionDays: 14
              MaxRetentionDays: 14
              BackupVaultTags:
                ApplicationId: !Ref ApplicationId
                RecoveryRequestId: !Ref RecoveryRequestId
                ProdRecipientAccountId: !If [HasProdRecipientAccount, !Ref ProdRecipientAccountId, 'LOCAL_TEST_ONLY']
                VaultRole: HandoffLAG

          CompatibilityStagingVault:
            Type: AWS::Backup::BackupVault
            Condition: CreateStagingVault
            Properties:
              BackupVaultName: !Sub 'rec-stg-${ApplicationId}-${RecoveryRequestId}'
              EncryptionKeyArn: !GetAtt RequestKmsKey.Arn
              BackupVaultTags:
                ApplicationId: !Ref ApplicationId
                RecoveryRequestId: !Ref RecoveryRequestId
                VaultRole: CompatibilityStaging

          # =========================================================================
          # 3. SERVICE PLACEMENT
          # =========================================================================
          WorkloadSecurityGroup:
            Type: AWS::EC2::SecurityGroup
            Properties:
              GroupName: !Sub 'rec-wkld-${ApplicationId}-${RecoveryRequestId}-sg'
              GroupDescription: !Sub 'Workload SG for ${ApplicationId} (${RecoveryRequestId})'
              VpcId: !ImportValue
                'Fn::Sub': '${FoundationEnvironmentName}-VpcId'
              # Ingress comes from the WorkloadIngressPort<port> rules below, one per port.
              SecurityGroupEgress:
                - Description: 'Restrict outbound traffic to the recovery VPC CIDR only'
                  IpProtocol: -1
                  CidrIp: !ImportValue
                    'Fn::Sub': '${FoundationEnvironmentName}-VpcCidr'
              Tags:
                - Key: Name
                  Value: !Sub 'rec-wkld-${ApplicationId}-${RecoveryRequestId}-sg'
                - Key: ApplicationId
                  Value: !Ref ApplicationId
                - Key: RecoveryRequestId
                  Value: !Ref RecoveryRequestId

          Fn::ForEach::WorkloadIngress:
            - Port
            - !Ref WorkloadPorts
            - WorkloadIngressPort${Port}:
                Type: AWS::EC2::SecurityGroupIngress
                Properties:
                  GroupId: !GetAtt WorkloadSecurityGroup.GroupId
                  Description: !Sub 'Allow validation traffic from Foundation Validation SG on port ${Port}'
                  IpProtocol: tcp
                  FromPort: !Ref Port
                  ToPort: !Ref Port
                  SourceSecurityGroupId: !ImportValue
                    'Fn::Sub': '${FoundationEnvironmentName}-ValidationSgId'

          # EFS mount targets need NFS (2049) independently of the database port, so
          # a request that restores a database and a file system gets both.
          EfsSecurityGroup:
            Type: AWS::EC2::SecurityGroup
            Properties:
              GroupName: !Sub 'rec-efs-${ApplicationId}-${RecoveryRequestId}-sg'
              GroupDescription: !Sub 'EFS mount-target SG for ${ApplicationId} (${RecoveryRequestId})'
              VpcId: !ImportValue
                'Fn::Sub': '${FoundationEnvironmentName}-VpcId'
              SecurityGroupIngress:
                - Description: 'Allow NFS from Foundation Validation SG'
                  IpProtocol: tcp
                  FromPort: 2049
                  ToPort: 2049
                  SourceSecurityGroupId: !ImportValue
                    'Fn::Sub': '${FoundationEnvironmentName}-ValidationSgId'
              SecurityGroupEgress:
                - Description: 'Restrict outbound traffic to the recovery VPC CIDR only'
                  IpProtocol: -1
                  CidrIp: !ImportValue
                    'Fn::Sub': '${FoundationEnvironmentName}-VpcCidr'
              Tags:
                - Key: Name
                  Value: !Sub 'rec-efs-${ApplicationId}-${RecoveryRequestId}-sg'
                - Key: ApplicationId
                  Value: !Ref ApplicationId
                - Key: RecoveryRequestId
                  Value: !Ref RecoveryRequestId

          DatabaseSubnetGroup:
            Type: AWS::RDS::DBSubnetGroup
            Properties:
              DBSubnetGroupName: !Sub 'rec-dbsg-${ApplicationId}-${RecoveryRequestId}'
              DBSubnetGroupDescription: !Sub 'Isolated DB Subnet Group for ${ApplicationId} (${RecoveryRequestId})'
              SubnetIds:
                - !ImportValue
                  'Fn::Sub': '${FoundationEnvironmentName}-SubnetIdA'
                - !ImportValue
                  'Fn::Sub': '${FoundationEnvironmentName}-SubnetIdB'
              Tags:
                - Key: ApplicationId
                  Value: !Ref ApplicationId
                - Key: RecoveryRequestId
                  Value: !Ref RecoveryRequestId

          # =========================================================================
          # 4. REQUEST EXECUTION ROLE (Supports Multiple Incoming Source KMS Keys)
          # =========================================================================
          RequestBackupAndRestoreRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: !Sub 'rec-app-restore-${ApplicationId}-${RecoveryRequestId}'
              PermissionsBoundary: !ImportValue
                'Fn::Sub': '${FoundationEnvironmentName}-BoundaryArn'
              AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: backup.amazonaws.com
                    Action: 'sts:AssumeRole'
                    Condition:
                      StringEquals:
                        'aws:SourceAccount': !Ref 'AWS::AccountId'
              # The AWS managed service-role policies carry the service-side actions
              # AWS Backup performs (snapshot, tag, create/restore resources, S3
              # inventory and EventBridge rules) and are kept current by AWS. The
              # Foundation permissions boundary caps them to RDS, EFS, EC2, S3 rec-*
              # buckets, and KMS data operations.
              ManagedPolicyArns:
                - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup'
                - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores'
                - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSBackupServiceRolePolicyForS3Backup'
                - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSBackupServiceRolePolicyForS3Restore'
              Policies:
                - PolicyName: ScopedRestoreAndVaultOperations
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Sid: KeyAccessForSourceLagVaultKeys
                        Effect: Allow
                        Action:
                          - 'kms:Decrypt'
                          - 'kms:ReEncrypt*'
                          - 'kms:DescribeKey'
                          - 'kms:CreateGrant'
                        Resource: !Ref SourceKmsKeyArns
                      - Sid: KeyAccessForLocalRequestKey
                        Effect: Allow
                        Action:
                          - 'kms:Decrypt'
                          - 'kms:Encrypt'
                          - 'kms:ReEncrypt*'
                          - 'kms:GenerateDataKey*'
                          - 'kms:DescribeKey'
                          - 'kms:CreateGrant'
                        Resource: !GetAtt RequestKmsKey.Arn

          # Attach to the operator role or automation that runs the runbook. AWS Backup
          # authorizes start-*-job against the caller, not against the service role.
          RequestOperatorPolicy:
            Type: AWS::IAM::ManagedPolicy
            Properties:
              ManagedPolicyName: !Sub 'rec-app-operator-${ApplicationId}-${RecoveryRequestId}'
              Description: !Sub 'Operator permissions to run backup, restore, copy, and handoff for ${ApplicationId} (${RecoveryRequestId})'
              PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Sid: PassRequestRoleToBackup
                    Effect: Allow
                    Action: 'iam:PassRole'
                    Resource: !GetAtt RequestBackupAndRestoreRole.Arn
                    Condition:
                      StringEquals:
                        'iam:PassedToService': 'backup.amazonaws.com'
                  - Sid: StartBackupsIntoRequestVaults
                    Effect: Allow
                    Action: 'backup:StartBackupJob'
                    Resource:
                      - !GetAtt HandoffLagVault.BackupVaultArn
                      - !If [CreateStagingVault, !GetAtt CompatibilityStagingVault.BackupVaultArn, !Ref 'AWS::NoValue']
                  - Sid: StartRestoresAndCopiesFromRecoveryPoints
                    Effect: Allow
                    Action:
                      - 'backup:StartRestoreJob'
                      - 'backup:StartCopyJob'
                    Resource: !Sub 'arn:${AWS::Partition}:backup:${AWS::Region}:*:recovery-point:*'
                  - Sid: ReadBackupState
                    Effect: Allow
                    Action:
                      - 'backup:Describe*'
                      - 'backup:Get*'
                      - 'backup:List*'
                    Resource: '*'
                  - Sid: ReadRequestParameters
                    Effect: Allow
                    Action:
                      - 'ssm:GetParameter'
                      - 'ssm:GetParameters'
                      - 'ssm:GetParametersByPath'
                    Resource:
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/recovery/${ApplicationId}/${RecoveryRequestId}'
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/recovery/${ApplicationId}/${RecoveryRequestId}/*'
                  - !If
                    - HasProdRecipientAccount
                    - Sid: ShareLagVaultWithProdOnly
                      Effect: Allow
                      Action:
                        - 'ram:CreateResourceShare'
                        - 'ram:AssociateResourceShare'
                      Resource: '*'
                      Condition:
                        StringEquals:
                          'ram:Principal': !Ref ProdRecipientAccountId
                    - !Ref 'AWS::NoValue'
                  - Sid: ReadResourceShares
                    Effect: Allow
                    Action:
                      - 'ram:Get*'
                      - 'ram:List*'
                    Resource: '*'

          # =========================================================================
          # 5. SSM PARAMETERS (Automatic Output Caching for Operators & Scripts)
          # =========================================================================
          ParamSourceKmsKeyArns:
            Type: AWS::SSM::Parameter
            Properties:
              Name: !Sub '/recovery/${ApplicationId}/${RecoveryRequestId}/source-kms-key-arns'
              Type: StringList
              Value: !Join [',', !Ref SourceKmsKeyArns]
              Description: !Sub 'Authorized Source LAG Vault KMS Key ARNs for ${ApplicationId} (${RecoveryRequestId})'
              Tags:
                ApplicationId: !Ref ApplicationId
                RecoveryRequestId: !Ref RecoveryRequestId

          ParamKmsKeyArn:
            Type: AWS::SSM::Parameter
            Properties:
              Name: !Sub '/recovery/${ApplicationId}/${RecoveryRequestId}/kms-key-arn'
              Type: String
              Value: !GetAtt RequestKmsKey.Arn
              Description: !Sub 'Unified CMK ARN for ${ApplicationId} (${RecoveryRequestId})'
              Tags:
                ApplicationId: !Ref ApplicationId
                RecoveryRequestId: !Ref RecoveryRequestId

          ParamLagVaultName:
            Type: AWS::SSM::Parameter
            Properties:
              Name: !Sub '/recovery/${ApplicationId}/${RecoveryRequestId}/lag-vault-name'
              Type: String
              Value: !Ref HandoffLagVault
              Description: !Sub '14-day locked LAG Vault Name for ${ApplicationId} (${RecoveryRequestId})'
              Tags:
                ApplicationId: !Ref ApplicationId
                RecoveryRequestId: !Ref RecoveryRequestId

          ParamLagVaultArn:
            Type: AWS::SSM::Parameter
            Properties:
              Name: !Sub '/recovery/${ApplicationId}/${RecoveryRequestId}/lag-vault-arn'
              Type: String
              Value: !GetAtt HandoffLagVault.BackupVaultArn
              Description: !Sub '14-day locked LAG Vault ARN for ${ApplicationId} (${RecoveryRequestId})'
              Tags:
                ApplicationId: !Ref ApplicationId
                RecoveryRequestId: !Ref RecoveryRequestId

          ParamStagingVaultName:
            Type: AWS::SSM::Parameter
            Condition: CreateStagingVault
            Properties:
              Name: !Sub '/recovery/${ApplicationId}/${RecoveryRequestId}/staging-vault-name'
              Type: String
              Value: !Ref CompatibilityStagingVault
              Description: !Sub 'Compatibility Staging Vault Name for ${ApplicationId} (${RecoveryRequestId})'
              Tags:
                ApplicationId: !Ref ApplicationId
                RecoveryRequestId: !Ref RecoveryRequestId

          ParamStagingVaultArn:
            Type: AWS::SSM::Parameter
            Condition: CreateStagingVault
            Properties:
              Name: !Sub '/recovery/${ApplicationId}/${RecoveryRequestId}/staging-vault-arn'
              Type: String
              Value: !GetAtt CompatibilityStagingVault.BackupVaultArn
              Description: !Sub 'Compatibility Staging Vault ARN for ${ApplicationId} (${RecoveryRequestId})'
              Tags:
                ApplicationId: !Ref ApplicationId
                RecoveryRequestId: !Ref RecoveryRequestId

          ParamRestoreRoleArn:
            Type: AWS::SSM::Parameter
            Properties:
