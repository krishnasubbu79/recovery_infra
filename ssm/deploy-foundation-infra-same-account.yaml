          # =========================================================================
          # 5. PERMISSIONS BOUNDARY FOR APP STACK ROLES
          # =========================================================================
          AppRolePermissionsBoundary:
            Type: AWS::IAM::ManagedPolicy
            Properties:
              ManagedPolicyName: !Sub '${EnvironmentName}-${AWS::Region}-app-boundary'
              Description: Mandatory permissions boundary for all IAM roles created by Application Stacks.
              # A boundary is a ceiling: the effective permission is the intersection
