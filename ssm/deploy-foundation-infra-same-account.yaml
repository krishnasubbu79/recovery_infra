          VpcCidr:
            Value: !GetAtt RecoveryVpc.CidrBlock
            Export:
              Name: !Sub '${EnvironmentName}-VpcCidr'
          SubnetIdA:
            Value: !Ref PrivateSubnetA
            Export:
