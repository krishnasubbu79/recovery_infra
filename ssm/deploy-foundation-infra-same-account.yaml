                    Effect: Allow
                    Action: 'iam:PassRole'
                    Resource: '*'
                    Condition:
                      StringEquals:
                        'iam:PassedToService': 'ec2.amazonaws.com'
                  - Sid: DenyNetworkEscapeAndFoundationChanges
                    Effect: Deny
                    Action:
                      - 'ec2:CreateVpc'
                      - 'ec2:DeleteVpc'
                      - 'ec2:ModifyVpcAttribute'
                      - 'ec2:CreateSubnet'
                      - 'ec2:DeleteSubnet'
                      - 'ec2:ModifySubnetAttribute'
                      - 'ec2:CreateRouteTable'
                      - 'ec2:DeleteRouteTable'
                      - 'ec2:CreateRoute'
                      - 'ec2:ReplaceRoute'
                      - 'ec2:AssociateRouteTable'
                      - 'ec2:ReplaceRouteTableAssociation'
                      - 'ec2:CreateInternetGateway'
                      - 'ec2:AttachInternetGateway'
                      - 'ec2:CreateEgressOnlyInternetGateway'
                      - 'ec2:CreateNatGateway'
                      - 'ec2:AllocateAddress'
                      - 'ec2:AssociateAddress'
                      - 'ec2:CreateVpcPeeringConnection'
                      - 'ec2:AcceptVpcPeeringConnection'
                      - 'ec2:CreateTransitGatewayVpcAttachment'
                      - 'ec2:CreateVpnGateway'
                      - 'ec2:AttachVpnGateway'
                      - 'ec2:CreateVpcEndpoint'
                      - 'ec2:DeleteFlowLogs'
                      - 'ec2:AuthorizeSecurityGroupIngress'
                      - 'ec2:AuthorizeSecurityGroupEgress'
                    Resource: '*'

        Outputs:
          FlowLogGroupName:
            Description: CloudWatch Logs group for VPC Flow Logs (retained when the stack is deleted).
            Value: !Ref VpcFlowLogGroup
          FailureLogGroupName:
            Description: CloudWatch Logs group recording CloudFormation and AWS Backup failures (deleted with the stack).
            Value: !Ref FailureLogGroup
          VpcId:
            Value: !Ref RecoveryVpc
            Export:
