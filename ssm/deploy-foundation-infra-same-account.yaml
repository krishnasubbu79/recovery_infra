                      - 'elasticfilesystem:*'
                      - 'ec2:*'
                      - 'ebs:StartSnapshot'
                      - 'ebs:PutSnapshotBlock'
                      - 'ebs:CompleteSnapshot'
                      - 'tag:GetResources'
                      - 'cloudwatch:GetMetricData'
                      - 'events:ListRules'
